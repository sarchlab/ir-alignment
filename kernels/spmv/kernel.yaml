name: spmv
description: "COO sparse matrix-vector product, nnz=24 on an 8x8 matrix (indirect loads and scattered read-modify-write stores)"
source: third_party/zeonica/test/Zeonica_Testbench/kernel/spmv/spmv.c
function: kernel
args:
  - {name: nnz, kind: scalar, value: 24}
  - {name: val, kind: array, size: 24, init: "(i * 7) % 9 - 4"}
  - {name: col, kind: array, size: 24, init: "(i * 5 + 1) % 8"}
  - {name: row, kind: array, size: 24, init: "i // 3"}
  - {name: feature, kind: array, size: 8, init: "i * 3 - 10"}
  - {name: output, kind: array, size: 8, init: "i"}

# Runs finish in a few hundred cycles; the cap turns a hang into a quick
# failure (VectorCGRA's Verilator backend runs ~140 cycles/s).
vectorcgra: {max_cycles: 8000, timeout: 1800}
